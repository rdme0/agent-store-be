import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.spring'
    id 'org.jetbrains.kotlin.plugin.jpa'
    id 'org.jetbrains.kotlin.plugin.lombok'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'dev.detekt'
}

group = 'com.agentstore'
version = '0.1.0-SNAPSHOT'
description = 'AgentStore Kotlin/Spring backend'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

kotlin {
    jvmToolchain(25)
    compilerOptions { jvmTarget = JvmTarget.JVM_25 }
}

repositories { mavenCentral() }

detekt {
    config.setFrom(file('detekt.yml'))
    buildUponDefaultConfig = false
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-scalar:3.0.3'
    implementation 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    implementation 'me.paulschwarz:springboot4-dotenv:5.1.0'
    implementation 'org.semver4j:semver4j:6.0.0'
    implementation 'com.networknt:json-schema-validator:2.0.4'
    implementation 'org.yaml:snakeyaml'
    implementation 'org.web3j:core:6.0.0'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    exclude '**/*IntegrationTest.class'
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Runs opt-in PostgreSQL and actual HTTP integration tests.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.named('test')
    include '**/*IntegrationTest.class'
    useJUnitPlatform()
    // This gate must evaluate its safety checks on every invocation. A skipped
    // up-to-date task must never bypass the dedicated database/fixture guard.
    outputs.upToDateWhen { false }

    doFirst {
        ['RUN_POSTGRES_INTEGRATION_TESTS', 'SPRING_EXCLUSIVE_MAINTENANCE'].each { name ->
            if (System.getenv(name) != 'true') {
                throw new GradleException("integrationTest requires $name=true")
            }
        }
        ['INTEGRATION_DATASOURCE_URL', 'INTEGRATION_DATASOURCE_PASSWORD'].each { name ->
            if (!System.getenv(name)?.trim()) {
                throw new GradleException("integrationTest requires environment variable: $name")
            }
        }
        def integrationUrl = System.getenv('INTEGRATION_DATASOURCE_URL')
        if (!(integrationUrl ==~ /(?i).*\/agent_store_integration(?:\?.*)?/)) {
            throw new GradleException('integrationTest requires INTEGRATION_DATASOURCE_URL to target agent_store_integration')
        }
    }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }

tasks.named('check') {
    dependsOn tasks.named('detektMain')
}

springBoot { mainClass = 'com.agentstore.AgentStoreApplicationKt' }
