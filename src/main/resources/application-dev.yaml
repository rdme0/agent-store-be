spring:
  datasource:
    url: jdbc:postgresql://localhost:${DEV_POSTGRES_PORT}/${DEV_POSTGRES_DB}?currentSchema=public
    username: ${DEV_POSTGRES_USER}
    password: ${DEV_POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10

agent-store:
  backend-url: http://localhost:${DEV_BACKEND_PORT}
  cors-origins:
    - http://localhost:*
    - http://127.0.0.1:*
