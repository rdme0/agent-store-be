spring:
  application:
    name: agent-store-be
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-version: 8
    baseline-description: prisma-schema-compatible
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: jdbc:postgresql://localhost:5432/agent_store?currentSchema=public
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10

server:
  address: 0.0.0.0
  port: 8080
  shutdown: graceful

springdoc:
  api-docs:
    path: /openapi.json
  info:
    title: AgentStore API
    version: 0.1.0

scalar:
  enabled: true
  path: /docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

agent-store:
  service-name: agent-store-api
  api-version: 0.1.0
  runtime-callback-base-url: http://127.0.0.1:8080
  demo-agent-base-url: http://127.0.0.1:8090
  cors-origins:
    - http://localhost:*
  runtime-token-secret: ${RUNTIME_TOKEN_SECRET}
  bithumb-api-url: https://api.bithumb.com
  bithumb-request-timeout: PT2S
  bithumb-cache-ttl: PT60S
  bithumb-stale-ttl: PT15M
  external-api:
    public-base-url: https://api.example.com
    pay-to: "0x0000000000000000000000000000000000000001"
    facilitator-url: https://facilitator.example.com
    facilitator-request-timeout: PT5S
    authorization-timeout: PT60S
    fee-basis-points: 250
    intent-ttl: PT5M
    receipt-ttl: PT15M
    rate-limit-per-minute: 30
