spring:
  application:
    name: agent-store-be
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-version: 8
    baseline-description: prisma-schema-compatible
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

server:
  address: ${HOST}
  port: ${PORT}
  shutdown: graceful

springdoc:
  api-docs:
    path: /openapi.json
  info:
    title: AgentStore API
    version: ${API_VERSION}

scalar:
  enabled: true
  path: /docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

agent-store:
  service-name: ${SERVICE_NAME}
  api-version: ${API_VERSION}
  runtime-callback-base-url: ${RUNTIME_CALLBACK_BASE_URL}
  cors-origins: ${CORS_ORIGINS}
  runtime-token-secret: ${RUNTIME_TOKEN_SECRET}
  payment-mode: ${PAYMENT_MODE}
