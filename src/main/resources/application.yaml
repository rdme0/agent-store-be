spring:
  application:
    name: agent-store-be
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-version: 8
    baseline-description: prisma-schema-compatible
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  http:
    converters:
      preferred-json-mapper: jackson2
server:
  address: 0.0.0.0
  port: 8080
  shutdown: graceful

springdoc:
  api-docs:
    path: /openapi.json
  info:
    title: AgentStore API
    version: 0.1.0

scalar:
  enabled: true
  path: /docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

agent-store:
  service-name: agent-store-api
  api-version: 0.1.0
  runtime-token-secret: ${RUNTIME_TOKEN_SECRET}
  bithumb-api-url: https://api.bithumb.com
  bithumb-request-timeout: PT2S
  bithumb-cache-ttl: PT60S
  bithumb-stale-ttl: PT15M
  x402-client:
    per-depth-invocation-timeout: PT30S
  external-api:
    receipt-ttl: PT15M
    rate-limit-per-minute: 5
    max-cost-atomic: "5000"
