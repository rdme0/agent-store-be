spring:
  application:
    name: agent-store-be
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-version: 8
    baseline-description: prisma-schema-compatible
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

server:
  address: ${HOST:0.0.0.0}
  port: ${PORT:18080}
  shutdown: graceful

springdoc:
  api-docs:
    path: /openapi.json
  info:
    title: AgentStore API
    version: ${API_VERSION:0.1.0}

scalar:
  enabled: true
  path: /docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

agent-store:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  runtime-token-secret: ${RUNTIME_TOKEN_SECRET:agent-store-development-runtime-secret}
  database-url: ${DATABASE_URL:postgresql://postgres:postgres@localhost:5432/agent_store?schema=public}
  test-database-url: ${TEST_DATABASE_URL:}
