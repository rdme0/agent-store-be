spring:
  application:
    name: agent-store-be
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-version: 8
    baseline-description: prisma-schema-compatible
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

server:
  address: ${HOST:0.0.0.0}
  port: ${PORT:18080}
  shutdown: graceful

springdoc:
  api-docs:
    path: /openapi.json
  info:
    title: AgentStore API
    version: ${API_VERSION:0.1.0}

scalar:
  enabled: true
  path: /docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

agent-store:
  service-name: ${SERVICE_NAME:agent-store-api}
  api-version: ${API_VERSION:0.1.0}
  runtime-callback-base-url: ${RUNTIME_CALLBACK_BASE_URL:http://127.0.0.1:8080}
  cors-origins: ${CORS_ORIGINS:http://localhost:*}
  runtime-token-secret: ${RUNTIME_TOKEN_SECRET:agent-store-development-runtime-secret}
  database-url: ${DATABASE_URL:postgresql://postgres:postgres@localhost:5432/agent_store?schema=public}
  payment-mode: ${PAYMENT_MODE:simulated}
  x402-bridge-url: ${X402_BRIDGE_URL:http://127.0.0.1:8091}
  x402-bridge-secret: ${X402_BRIDGE_SECRET:}
